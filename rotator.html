<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Rotator</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .6s; }
  iframe.on { opacity: 1; }
  #msg { position: absolute; bottom: 12px; right: 16px; font: 14px/1.4 system-ui, sans-serif;
         color: #fff; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 4px; display: none; z-index: 9; }
</style>
</head>
<body>
<iframe id="a" allowfullscreen></iframe>
<iframe id="b" allowfullscreen></iframe>
<div id="msg"></div>
<script>
  const qs = new URLSearchParams(location.search);
  const TV = (qs.get('tv') || '').toLowerCase();          // ex.: rotator.html?tv=tv01
  const DEBUG = qs.has('debug');
  const CONFIG_URL = qs.get('config') || 'config.json';
  const frames = [document.getElementById('a'), document.getElementById('b')];
  const msg = document.getElementById('msg');
  let active = 0, currentUrl = null, config = null;

  function show(text) { msg.textContent = text; msg.style.display = text ? 'block' : 'none'; }

  async function loadConfig() {
    try {
      const r = await fetch(CONFIG_URL + '?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      config = await r.json();
      config.schedule.sort((x, y) => x.time.localeCompare(y.time));
    } catch (e) {
      if (!config) show('Não foi possível ler ' + CONFIG_URL + ' (' + e.message + ')');
    }
  }

  function resolveUrl() {
    if (!config || !config.schedule.length) return null;
    const d = new Date();
    const hhmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    // Último horário <= agora; antes do primeiro horário do dia, usa o primeiro.
    let slot = config.schedule[0];
    for (const s of config.schedule) if (s.time <= hhmm) slot = s;
    const key = (slot.tvs && slot.tvs[TV]) || slot.default;
    if (!key) return null;
    return key.startsWith('http') ? key : (config.reports[key] || null);
  }

  function swapTo(url) {
    const next = frames[1 - active], cur = frames[active];
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      next.classList.add('on'); cur.classList.remove('on');
      setTimeout(() => { cur.src = 'about:blank'; }, 1000);
      active = 1 - active;
    };
    next.onload = () => setTimeout(finish, 3000);   // dá tempo do Power BI renderizar
    setTimeout(finish, 25000);                      // fallback se onload não disparar
    next.src = url;
  }

  function tick() {
    if (!TV) { show('Informe a TV na URL: rotator.html?tv=tv01'); return; }
    const url = resolveUrl();
    if (!url) { show('Sem relatório configurado para "' + TV + '" neste horário'); return; }
    if (DEBUG) show(TV + ' → ' + url);
    else if (msg.textContent.startsWith('Sem relatório') || msg.textContent.startsWith('Informe')) show('');
    if (url !== currentUrl) { currentUrl = url; swapTo(url); }
  }

  (async () => {
    await loadConfig();
    tick();
    setInterval(tick, 30 * 1000);
    setInterval(async () => { await loadConfig(); tick(); },
                ((config && config.configReloadMinutes) || 5) * 60 * 1000);
    // Recarrega a página toda madrugada para limpar memória do player
    setInterval(() => { const h = new Date().getHours(); if (h === 4) location.reload(); }, 60 * 60 * 1000);
  })();
</script>
</body>
</html>
